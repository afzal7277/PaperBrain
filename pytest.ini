[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --tb=short
    --no-header
    -p no:warnings

# Markers
markers =
    unit: Unit tests (no API calls)
    qa: QA evaluation tests (requires Groq API + indexed PDFs)
    slow: Slow tests
